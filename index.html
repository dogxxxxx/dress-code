<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新人姓名 婚禮 Dress Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Iansui&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="paper-bg">
    <header class="site-header">
      <p class="eyebrow">Wedding Dress Code</p>
      <h1 class="couple-names">新人姓名 <span class="amp">&amp;</span> 新人姓名</h1>
      <p class="wedding-date">婚禮日期：2026 / 00 / 00</p>
      <p class="subtitle">歡迎參加我們的婚禮 🎉 請依照下方指南穿搭出席唷！</p>
      <svg class="doodle-divider" viewBox="0 0 300 20" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,10 Q15,0 30,10 T60,10 T90,10 T120,10 T150,10 T180,10 T210,10 T240,10 T270,10 T300,10"
              fill="none" stroke="#c9a877" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </header>

    <nav class="gender-switch" aria-label="賓客類別切換">
      <button type="button" class="switch-btn switch-btn--male active" data-target="male" aria-selected="true">
        <span class="btn-icon" aria-hidden="true">🤵</span> 男賓客
      </button>
      <button type="button" class="switch-btn switch-btn--female" data-target="female" aria-selected="false">
        <span class="btn-icon" aria-hidden="true">👗</span> 女賓客
      </button>
    </nav>

    <main>
      <section id="panel-male" class="dress-panel active">
        <div class="color-section color-section--blue">
          <h2 class="color-title"><span aria-hidden="true">💙</span> 藍色系</h2>
          <div class="gallery">
            <figure class="gallery-item">
              <img src="images/male/blue/01.svg" alt="男賓客藍色系穿搭範例 1" loading="lazy">
              <figcaption>範例 1</figcaption>
            </figure>
            <figure class="gallery-item">
              <img src="images/male/blue/02.svg" alt="男賓客藍色系穿搭範例 2" loading="lazy">
              <figcaption>範例 2</figcaption>
            </figure>
            <figure class="gallery-item">
              <img src="images/male/blue/03.svg" alt="男賓客藍色系穿搭範例 3" loading="lazy">
              <figcaption>範例 3</figcaption>
            </figure>
          </div>
        </div>

        <div class="color-section color-section--pink">
          <h2 class="color-title"><span aria-hidden="true">💗</span> 粉色系</h2>
          <div class="gallery">
            <figure class="gallery-item">
              <img src="images/male/pink/01.svg" alt="男賓客粉色系穿搭範例 1" loading="lazy">
              <figcaption>範例 1</figcaption>
            </figure>
            <figure class="gallery-item">
              <img src="images/male/pink/02.svg" alt="男賓客粉色系穿搭範例 2" loading="lazy">
              <figcaption>範例 2</figcaption>
            </figure>
            <figure class="gallery-item">
              <img src="images/male/pink/03.svg" alt="男賓客粉色系穿搭範例 3" loading="lazy">
              <figcaption>範例 3</figcaption>
            </figure>
          </div>
        </div>
      </section>

      <section id="panel-female" class="dress-panel" hidden>
        <div class="color-section color-section--blue">
          <h2 class="color-title"><span aria-hidden="true">💙</span> 藍色系</h2>
          <div class="gallery">
            <figure class="gallery-item">
              <img src="images/female/blue/01.svg" alt="女賓客藍色系穿搭範例 1" loading="lazy">
              <figcaption>範例 1</figcaption>
            </figure>
            <figure class="gallery-item">
              <img src="images/female/blue/02.svg" alt="女賓客藍色系穿搭範例 2" loading="lazy">
              <figcaption>範例 2</figcaption>
            </figure>
            <figure class="gallery-item">
              <img src="images/female/blue/03.svg" alt="女賓客藍色系穿搭範例 3" loading="lazy">
              <figcaption>範例 3</figcaption>
            </figure>
          </div>
        </div>

        <div class="color-section color-section--pink">
          <h2 class="color-title"><span aria-hidden="true">💗</span> 粉色系</h2>
          <div class="gallery">
            <figure class="gallery-item">
              <img src="images/female/pink/01.svg" alt="女賓客粉色系穿搭範例 1" loading="lazy">
              <figcaption>範例 1</figcaption>
            </figure>
            <figure class="gallery-item">
              <img src="images/female/pink/02.svg" alt="女賓客粉色系穿搭範例 2" loading="lazy">
              <figcaption>範例 2</figcaption>
            </figure>
            <figure class="gallery-item">
              <img src="images/female/pink/03.svg" alt="女賓客粉色系穿搭範例 3" loading="lazy">
              <figcaption>範例 3</figcaption>
            </figure>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>期待與你相聚 💌</p>
    </footer>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
